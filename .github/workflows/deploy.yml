name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest + sha-<short> 두 태그
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy on self-hosted runner
    runs-on: [self-hosted, mediprice]
    needs: build-and-push
    permissions:
      contents: read
      packages: read
    steps:
      - name: Sync compose + pull image + restart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          cd /app

          # 호스트 bind-mount 디렉터리는 host UID 소유 → git이 dubious ownership 경고
          git config --global --add safe.directory /app

          # GITHUB_TOKEN으로 fetch 인증 (runner container에는 git creds 없음)
          # extraheader는 .git/config에 안 남고 이 명령에서만 사용됨
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" fetch origin master
          git reset --hard origin/master

          # GHCR private 이미지 pull 인증
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin

          # 새 이미지 pull + 컨테이너 재기동
          docker compose pull
          docker compose up -d --no-build

          # 헬스체크 (mediprice-network로 직접 호출, 60초 대기)
          for i in $(seq 1 30); do
            if curl -fs http://mediprice-app:8080/api/health >/dev/null; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed — recent app logs:"
          docker compose logs --tail=100 app
          exit 1

      - name: Cleanup dangling images
        if: success()
        run: docker image prune -f
