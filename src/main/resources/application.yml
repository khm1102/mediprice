db:
  url: ${DB_URL:jdbc:postgresql://db:5774/mediprice}
  username: ${DB_USERNAME:mediprice}
  # 의도적으로 fallback 없음: 환경변수 누락 시 부팅 실패 (약한 비밀번호로 운영 가는 사고 차단)
  password: ${DB_PASSWORD}
  pool-size: ${DB_POOL_SIZE:30}
  min-idle: ${DB_MIN_IDLE:10}
  # PostgreSQL idle_in_transaction_session_timeout보다 짧게 (default 30분)
  max-lifetime: ${DB_MAX_LIFETIME:1800000}
  # >0이면 활성화. 운영은 30000ms (30s) 권장. 0 = 비활성
  leak-detection: ${DB_LEAK_DETECTION:0}

jpa:
  # 운영 환경에서는 반드시 validate 사용. 개발 편의를 위해 update 기본값 유지
  ddl-auto: ${JPA_DDL_AUTO:update}
  # 운영 PII 노출 방지를 위해 기본값 false. 개발 시 환경변수로 true 지정
  show-sql: ${JPA_SHOW_SQL:false}
  format-sql: ${JPA_FORMAT_SQL:false}

jwt:
  # 기본값 의도적으로 제거: 환경변수 미지정 시 빈 주입 단계에서 부팅 실패
  # 운영 키는 32바이트(256비트) 이상 HMAC-SHA256 호환 키여야 함 (P1 JwtUtil에서 길이 검증)
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

naver:
  map-key: ${NAVER_MAP_KEY:}

hira:
  # 단일 키 fallback. 다중 키 운영 시 hira.api-keys 권장.
  api-key: ${HIRA_API_KEY:your-hira-key}
  # 콤마 구분 다중 키. 일일 한도(키당 10,000건) 회피 목적. 비어있으면 api-key 단독 사용.
  api-keys: ${HIRA_API_KEYS:}
  # 의료기관별상세정보서비스 base URL — 테스트에서 WireMock 주소로 오버라이드 가능
  detail-base-url: ${HIRA_DETAIL_BASE_URL:http://apis.data.go.kr/B551182/MadmDtlInfoService2.7}
  # 비급여진료비정보서비스 base URL — 테스트에서 WireMock 주소로 오버라이드 가능
  nonpay-base-url: ${HIRA_NONPAY_BASE_URL:http://apis.data.go.kr/B551182/nonPaymentDamtInfoService}

cache:
  # 주의: ConcurrentMapCacheManager는 TTL 미지원. 이 값은 현재 적용되지 않음
  ttl-seconds: ${CACHE_TTL_SECONDS:3600}

guest:
  search-limit: ${GUEST_SEARCH_LIMIT:3}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}

google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/auth/oauth2/callback}
