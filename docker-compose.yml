services:
  app:
    # 운영: GitHub Actions가 master push 시 ghcr.io에 푸시 → 서버에서 pull
    # 로컬: docker compose build로 로컬 빌드 가능 (같은 태그 재사용)
    image: ghcr.io/khm1102/mediprice:latest
    build: .
    container_name: mediprice-app
    restart: unless-stopped
    env_file:
      - .env
    # DB는 호스트의 cloudflared(localhost:5774)로 접근 — Linux 호환 위해 host-gateway 매핑
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - mediprice-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

# infra 레포의 nginx/prometheus가 이 네트워크에 external로 붙어 mediprice-app:8080을 upstream으로 사용
networks:
  mediprice-network:
    external: true
    name: mediprice-network
