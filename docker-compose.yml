services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: mediprice-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: mediprice
      POSTGRES_USER: ${DB_USERNAME:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mediprice-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-admin} -d mediprice"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: mediprice-app
    env_file:
      - .env
    # .env의 DB_URL은 호스트에서 IDE로 띄울 때 기준(localhost). 컨테이너 내부에서는 db 서비스명으로 덮어쓴다.
    environment:
      DB_URL: jdbc:postgresql://db:5432/mediprice?reWriteBatchedInserts=true
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

volumes:
  mediprice-data:
